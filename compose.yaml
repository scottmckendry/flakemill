# Local test rig with hot-reload: every save under src/ rebuilds and
# restarts the container via cargo-watch.
#
#   podman compose up --build
#   curl localhost:8080/healthz
#   curl localhost:8080/manifest.json | jq
#
# run ./secrets/make-keys.sh to create signing keys
#
# NOTE: this is the dev rig. Release images are built from `Containerfile`
# (see the publish workflow), which bakes in a prebuilt binary instead.

services:
  flakemill:
    build:
      context: .
      dockerfile: Containerfile.dev
    image: flakemill-dev
    container_name: flakemill
    ports:
      - "8080:8080"
    volumes:
      - ./src:/build/src
      - ./Cargo.toml:/build/Cargo.toml
      - ./Cargo.lock:/build/Cargo.lock
      - flakemill-target:/build/target
      - flakemill-sccache:/build/sccache
      - nix-store:/nix
      - service-data:/var/lib/flakemill
      - ./keys:/secrets:ro
      - ./secrets/.env:/secrets/.env:ro
    environment:
      REPO_URL: https://github.com/scottmckendry/nix
      BRANCH: main
      SYSTEMS: eris
      CACHIX_CACHE: scottmckendry
      SIGN_KEY: /secrets/sign.key
      INTERVAL_SECS: "300"
      # base URL hosts reach this rig at, so the dashboard and logs can print a
      # substituter URL to copy; set per tunnel when not using localhost:8080
      PUBLIC_URL: http://localhost:8080
    env_file:
      - ./secrets/.env
    privileged: true
    tmpfs:
      - /tmp

volumes:
  nix-store:
  service-data:
  flakemill-target:
  flakemill-sccache:
