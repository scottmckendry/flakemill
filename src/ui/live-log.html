<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live build log · flakemill</title>
    <style>
      :root { color-scheme: dark light; }
      body { background: #16181a; color: #fff; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; padding: 1.5rem; }
      a { color: #5ef1ff; }
      h1 { font-size: 1.1rem; color: #ffbd5e; margin: 0 0 0.5rem; }
      .meta { color: #aab3c2; margin-bottom: 1rem; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
      @media (prefers-color-scheme: light) {
        body { background: #fff; color: #16181a; }
        a { color: #008c99; }
        h1 { color: #a45e00; }
        .meta { color: #555; }
      }
    </style>
  </head>
  <body>
    <h1 id="title">Live build log</h1>
    <div class="meta"><span id="status">Connecting…</span> · Last 32 KiB · <a id="full-log">Full log</a> · <a href="/">Dashboard</a></div>
    <pre id="output">Waiting for output…</pre>
    <script>
      const params = new URLSearchParams(location.search);
      const log = params.get("log");
      const host = params.get("host");
      const title = document.getElementById("title");
      const status = document.getElementById("status");
      const output = document.getElementById("output");
      if (host) title.textContent = `Live build log · ${host}`;
      if (log) document.getElementById("full-log").href = `/logs/${encodeURIComponent(log)}`;

      async function refresh() {
        if (!log) {
          status.textContent = "No log specified";
          document.getElementById("full-log").hidden = true;
          return;
        }
        try {
          // Check state first, then read the tail so completion includes final output.
          const stateResponse = await fetch("/ui.json", { cache: "no-store" });
          if (!stateResponse.ok) throw new Error("Dashboard unavailable");
          const state = await stateResponse.json();
          const response = await fetch(`/log-tail/${encodeURIComponent(log)}`, { cache: "no-store" });
          if (!response.ok) throw new Error("Log unavailable");
          const text = await response.text();
          const atBottom = document.documentElement.scrollHeight - window.scrollY - window.innerHeight < 30;
          output.textContent = text || "Waiting for output…";
          if (atBottom) window.scrollTo(0, document.documentElement.scrollHeight);
          if (state.running && state.active_build?.log === log) {
            status.textContent = "Live · updates every 2 seconds";
            setTimeout(refresh, 2000);
          } else {
            status.textContent = "Build no longer running · final output";
          }
        } catch {
          status.textContent = "Connection lost or log unavailable · retrying…";
          setTimeout(refresh, 2000);
        }
      }
      refresh();
    </script>
  </body>
</html>
