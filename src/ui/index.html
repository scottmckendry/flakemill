<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flakemill</title>
    <style>
      :root {
        --bg: #16181a;
        --bg-alt: #1e2124;
        --bg-hl: #3c4048;
        --fg: #ffffff;
        --grey: #7b8496;
        --blue: #5ea1ff;
        --green: #5eff6c;
        --cyan: #5ef1ff;
        --red: #ff6e5e;
        --yellow: #f1ff5e;
        --magenta: #ff5ef1;
        --orange: #ffbd5e;
        --border: #3c4048;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --bg-alt: #eaeaea;
          --bg-hl: #acacac;
          --fg: #16181a;
          --blue: #0057d1;
          --green: #008b0c;
          --cyan: #008c99;
          --red: #d11500;
          --yellow: #997b00;
          --magenta: #d100bf;
          --orange: #d17c00;
          --border: #acacac;
        }
      }
      * {
        box-sizing: border-box;
        border: 0;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        line-height: 1.6;
        max-width: 64rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      a {
        color: var(--cyan);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      a:hover {
        color: var(--blue);
      }
      h1 {
        color: var(--orange);
        font-size: 1.5rem;
      }
      h1::before {
        content: "# ";
        color: var(--grey);
      }
      h2 {
        color: var(--cyan);
        font-size: 1.1rem;
        margin: 2rem 0 0.75rem;
      }
      h2::before {
        content: "## ";
        color: var(--grey);
      }
      .sub {
        color: var(--grey);
        margin: 0.25rem 0 2rem;
      }
      .card {
        background: var(--bg-alt);
        border: 1px solid var(--border);
        padding: 1rem 1.25rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: 1rem;
      }
      .label {
        color: var(--grey);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .value {
        color: var(--fg);
        font-size: 1.05rem;
        overflow-wrap: anywhere;
      }
      .value.blue {
        color: var(--blue);
      }
      .value.cyan {
        color: var(--cyan);
      }
      .value.orange {
        color: var(--orange);
      }
      .status-card {
        display: grid;
        grid-template-rows: auto 1.8rem auto;
        align-items: center;
        gap: 0.25rem;
      }
      .status-card .value {
        font-size: 1.1rem;
      }
      .countdown {
        font-variant-numeric: tabular-nums;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 0.4rem 0.5rem;
        text-align: left;
        font-size: 0.9rem;
      }
      th {
        color: var(--grey);
        font-weight: normal;
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .status {
        display: inline-block;
        padding: 0.05rem 0.5rem;
        font-weight: bold;
      }
      .status-ok,
      .status-up-to-date {
        color: var(--green);
      }
      .status-failed {
        color: var(--red);
      }
      .status-running {
        color: var(--yellow);
      }
      .status-idle,
      .status-unknown {
        color: var(--grey);
      }
      .status-ok::before {
        content: "[ ok ]";
      }
      .status-up-to-date::before {
        content: "[ up-to-date ]";
      }
      .status-failed::before {
        content: "[ failed ]";
      }
      .status-running::before {
        content: "[ running ]";
      }
      .status-idle::before {
        content: "[ idle ]";
      }
      .status-unknown::before {
        content: "[ … ]";
      }
      .dot {
        display: inline-block;
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        margin-right: 0.4em;
        vertical-align: baseline;
      }
      .dot-ok {
        background: var(--green);
      }
      .dot-failed {
        background: var(--red);
      }
      .dot-idle {
        background: var(--grey);
      }
      .log-link {
        color: var(--cyan);
        font-size: 0.72rem;
        margin-left: 0.5em;
      }
      .tag {
        display: inline-block;
        font-size: 0.72rem;
        padding: 0 0.4rem;
        margin-right: 0.4em;
        font-weight: bold;
      }
      .tag-built {
        color: var(--bg);
        background: var(--orange);
      }
      .tag-cached {
        color: var(--bg);
        background: var(--green);
      }
      .muted {
        color: var(--grey);
      }
      .failure-title {
        color: var(--red);
        font-weight: bold;
      }
      .failure-log {
        display: inline-block;
        margin: 0.25rem 0;
      }
      #error-box {
        margin-top: 0.5rem;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .attempt-cell {
        white-space: nowrap;
      }
      #live-log-link {
        color: var(--blue);
        text-decoration: none;
        text-transform: none;
      }
      #live-log-link:hover {
        color: var(--cyan);
      }
      #refresh-state {
        color: var(--grey);
      }
      #refresh-state.stale {
        color: var(--red);
      }
      footer {
        color: var(--grey);
        margin-top: 3rem;
        font-size: 0.8rem;
      }
      footer a {
        color: var(--grey);
      }
      footer a:hover {
        color: var(--blue);
      }
      footer::before {
        content: "~ ";
        color: var(--grey);
      }
      :root {
        color-scheme: dark;
        --bg: #16181a;
        --bg-alt: #1e2124;
        --bg-hl: #3c4048;
        --fg: #ffffff;
        --grey: #7b8496;
        --blue: #78a8e8;
        --green: #7ee088;
        --cyan: #7ed8e8;
        --red: #e8796f;
        --yellow: #e3c875;
        --magenta: #e878d8;
        --orange: #e3a875;
        --border: #3c4048;
      }
      body {
        max-width: 76rem;
        padding: 0 1.5rem 3rem;
        background: var(--bg);
        font-size: 0.875rem;
      }
      a {
        text-decoration-color: #536f78;
        text-underline-offset: 3px;
      }
      a:focus-visible {
        outline: 2px solid var(--yellow);
        outline-offset: 3px;
      }
      .topbar {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem 0 0.75rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }
      .brand,
      .brand:hover {
        color: inherit;
        text-decoration: none;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 2.5rem;
        height: 2.5rem;
        color: var(--cyan);
        font-size: 1.85rem;
        line-height: 1;
      }
      h1 {
        color: var(--fg);
        font-size: 1.15rem;
        line-height: 1.2;
      }
      h1::before,
      h2::before,
      footer::before {
        content: none;
      }
      .brand small,
      .top-links {
        color: var(--grey);
        font-size: 0.7rem;
      }
      .top-links {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .top-links a {
        color: var(--grey);
      }
      .top-links a:hover {
        color: var(--cyan);
      }
      .section-kicker {
        color: var(--cyan);
        font-weight: bold;
      }
      .snow {
        position: absolute;
        inset: 0 0 -5rem;
        overflow: hidden;
        pointer-events: none;
        color: var(--cyan);
        opacity: 0.45;
        mask-image: linear-gradient(to bottom, #000 30%, transparent 100%);
      }
      .snow span {
        position: absolute;
        animation: snowfall 8s linear infinite;
      }
      .snow span:nth-child(1) {
        left: 12%;
        animation-delay: -2s;
      }
      .snow span:nth-child(2) {
        left: 38%;
        animation-delay: -5s;
      }
      .snow span:nth-child(3) {
        left: 62%;
        animation-delay: -1s;
      }
      .snow span:nth-child(4) {
        left: 80%;
        animation-delay: -6s;
      }
      .snow span:nth-child(5) {
        left: 94%;
        animation-delay: -3s;
      }
      @keyframes snowfall {
        from {
          transform: translate(0, -2rem);
        }
        to {
          transform: translate(1rem, 10rem);
        }
      }
      @keyframes mill-turn {
        to {
          transform: rotate(360deg);
        }
      }
      .section-heading {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 2.5rem 0 0.85rem;
      }
      main > .section-heading:first-child {
        margin-top: 0.75rem;
      }
      .section-heading h2 {
        margin: 0;
        color: var(--fg);
        font-size: 1rem;
      }
      .section-heading::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--border);
      }
      .card {
        border: 1px solid var(--border);
        background: var(--bg-alt);
        padding: 1.25rem;
        box-shadow: 3px 3px 0 #111315;
      }
      .overview {
        display: grid;
        grid-template-columns: 1.25fr 1fr 1fr;
        gap: 1rem;
      }
      .overview .card {
        min-width: 0;
      }
      .status-card {
        min-height: 8rem;
        grid-template-rows: auto 1fr auto;
      }
      .status-card .value,
      .last-run-value {
        font-size: 1.1rem;
      }
      .countdown {
        letter-spacing: 0.04em;
      }
      .clock-tick {
        display: inline-block;
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        color: var(--cyan);
        margin-right: 0.5rem;
        transform-origin: 50% 50%;
        will-change: transform;
        animation: clock-bob 1s steps(2) infinite;
      }
      .clock-tick svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      body.is-running .clock-tick {
        animation: mill-turn 2.4s linear infinite;
        backface-visibility: hidden;
      }
      @keyframes clock-bob {
        50% {
          transform: translateY(-3px);
        }
      }
      .label {
        color: #9aa5b5;
        font-size: 0.67rem;
        letter-spacing: 0.1em;
      }
      .status {
        padding: 0;
      }
      .status-ok::before {
        content: "✓ completed";
      }
      .status-up-to-date::before {
        content: "✓ up to date";
      }
      .status-failed::before {
        content: "✕ failed";
      }
      .status-unknown::before {
        content: "— unknown";
      }
      .dot {
        border-radius: 0;
      }
      .table-wrap {
        padding: 0.5rem 1.25rem;
      }
      table {
        min-width: 38rem;
      }
      th,
      td {
        padding: 0.9rem 0.65rem;
      }
      th {
        font-size: 0.65rem;
        color: #9aa5b5;
      }
      .source-card table {
        min-width: 0;
      }
      .source-card tbody {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem 2rem;
      }
      .source-card tr {
        display: grid;
        grid-template-columns: 6rem minmax(0, 1fr);
        align-items: baseline;
      }
      .source-card td {
        padding: 0.25rem 0.65rem;
      }
      .source-card .value {
        color: var(--fg);
        font-size: 0.85rem;
      }
      .source-card a {
        overflow-wrap: anywhere;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        margin: 0;
        padding: 0.1rem 0.4rem;
        line-height: 1.4;
        white-space: nowrap;
      }
      .tag svg {
        width: 0.9rem;
        height: 0.9rem;
        flex: none;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
        margin-top: 1.5rem;
      }
      .footer-flake {
        color: var(--cyan);
        margin-right: 0.5rem;
      }
      @media (max-width: 720px) {
        body {
          padding: 0 1rem 2rem;
        }
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .overview {
          grid-template-columns: 1fr;
        }
        .source-card tbody {
          grid-template-columns: 1fr;
        }
        .status-card {
          min-height: 7rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="snow" aria-hidden="true">
        <span>❄</span><span>·</span><span>❄</span><span>·</span><span>❄</span>
      </div>
      <a id="source-link" class="brand" target="_blank" rel="noopener noreferrer">
        <span class="brand-mark" aria-hidden="true">❄</span>
        <h1>flakemill</h1>
      </a>
      <nav class="top-links" aria-label="Service links">
        <a href="/manifest.json">manifest.json</a
        ><a href="/flake.lock">flake.lock</a><a href="/healthz">healthz</a>
      </nav>
    </header>

    <main>
      <div class="section-heading">
        <span class="section-kicker" aria-hidden="true">//</span>
        <h2>status</h2>
      </div>
      <div class="overview">
        <div class="card status-card">
          <span class="label">last run</span>
          <span id="status" class="status status-unknown last-run-value"></span>
          <span
            id="last-run-detail"
            class="value"
            style="color: var(--grey)"
          ></span>
          <div id="error-box" style="display: none">
            <span id="failure-title"></span>
            <span id="failure-link"></span>
            <div id="failure-message" class="muted"></div>
          </div>
        </div>

        <div class="card status-card">
          <span id="schedule-label" class="label">next run</span>
          <span class="value blue"
            ><span class="clock-tick" aria-hidden="true"
              ><svg viewBox="-12 -12 24 24" focusable="false">
                <defs>
                  <g id="flake-arm">
                    <path d="M0-10V10"></path>
                    <path
                      d="M0-7-2.6-9.4M0-7 2.6-9.4M0 7-2.6 9.4M0 7 2.6 9.4"
                    ></path>
                  </g>
                </defs>
                <g
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                >
                  <use href="#flake-arm"></use>
                  <use href="#flake-arm" transform="rotate(60)"></use>
                  <use href="#flake-arm" transform="rotate(120)"></use>
                </g></svg></span
            ><span id="countdown" class="countdown">&mdash;</span></span
          >
          <span
            ><span id="next-run-at" class="label"></span
            ><a
              id="live-log-link"
              class="label"
              target="_blank"
              rel="noopener noreferrer"
              hidden
              >view logs ↗</a
            ></span
          >
        </div>
        <div class="card status-card">
          <span class="label">published lock</span>
          <span id="health" class="value"
            ><span class="dot dot-idle"></span>unknown</span
          >
          <span id="serving" class="label"></span>
        </div>
      </div>

      <div class="section-heading">
        <span class="section-kicker" aria-hidden="true">//</span>
        <h2>fleet</h2>
      </div>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>host</th>
              <th>latest attempt</th>
              <th title="Output from the last successful publication">
                published output
              </th>
              <th title="Build outcome from the last successful publication">
                published build
              </th>
              <th>duration / log</th>
            </tr>
          </thead>
          <tbody id="systems">
            <tr>
              <td colspan="5" style="color: var(--grey)">loading…</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="section-heading">
        <span class="section-kicker" aria-hidden="true">//</span>
        <h2>source</h2>
      </div>
      <div class="card source-card table-wrap">
        <table>
          <tbody id="source"></tbody>
        </table>
      </div>
    </main>
    <footer>
      <span class="footer-flake" aria-hidden="true">❄</span> uptime
      <span id="uptime">&mdash;</span> &middot;
      <span id="refresh-state" title="Refreshes every 15s">connecting…</span>
      <span id="build-version" hidden> · <a id="release-link" target="_blank" rel="noopener noreferrer"></a></span>
    </footer>

    <script>
      const $ = (id) => document.getElementById(id);
      const epoch = (s) =>
        s ? new Date(Number(s) * 1000).toLocaleString() : "\u2014";
      const short = (s) => (s ? s.slice(0, 10) : "\u2014");
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const repoHref = (u) => {
        if (!u) return "";
        const scpLike = /^git@([^:]+):(.+)$/.exec(u);
        const sshUrl = /^ssh:\/\/git@([^/]+)\/(.+)$/.exec(u);
        const m = scpLike || sshUrl;
        const href = m ? `https://${m[1]}/${m[2]}` : u;
        return href.replace(/\.git\/?$/, "");
      };
      const ago = (s) => {
        if (!s) return "";
        const d = Date.now() / 1000 - Number(s);
        if (d < 0) return "";
        const h = Math.floor(d / 3600),
          m = Math.floor((d % 3600) / 60);
        if (h > 0) return ` · ${h}h${m}m ago`;
        if (m > 0) return ` · ${m}m ago`;
        return ` · just now`;
      };
      const hms = (s) => {
        if (s <= 0) return "00:00:00";
        const h = Math.floor(s / 3600),
          m = Math.floor((s % 3600) / 60),
          sec = Math.floor(s % 60);
        const p = (n) => String(n).padStart(2, "0");
        return `${p(h)}:${p(m)}:${p(sec)}`;
      };

      let nextRunAt = null;
      let running = false;
      let lastRefresh = null;
      let uptimeSample = null;
      const logLink = (name, label) =>
        `<a class="failure-log" href="/logs/${encodeURIComponent(name)}">${esc(label)}</a>`;

      function render(d) {
        nextRunAt = d.next_run_at ? Number(d.next_run_at) : null;
        running = !!d.running;
        document.body.classList.toggle("is-running", running);
        uptimeSample =
          d.uptime_secs == null
            ? null
            : { seconds: Number(d.uptime_secs), at: performance.now() };
        const activeBuild = running ? d.active_build : null;
        $("live-log-link").hidden = !activeBuild;
        if (activeBuild) {
          const params = new URLSearchParams({
            log: activeBuild.log,
            host: activeBuild.host,
          });
          $("live-log-link").href = `/live-log?${params}`;
        }

        const m = d.manifest || {};
        const known = ["ok", "failed", "up-to-date", "unknown"];
        const status = known.includes(m.status) ? m.status : "unknown";
        $("status").className = `status status-${status}`;
        $("last-run-detail").textContent =
          (m.updated_at ? ` · ${epoch(m.updated_at)}` : "") + ago(m.updated_at);

        const err = $("error-box");
        const failure = m.status === "failed" ? m.failure : null;
        if (m.status === "failed") {
          err.style.display = "block";
          $("failure-title").textContent = failure
            ? `${failure.stage} · ${failure.host}`
            : "Affected host unknown";
          $("failure-link").innerHTML = failure?.log
            ? ` · ${logLink(failure.log, "View failure log →")}`
            : ' · <span class="muted">No failure log available</span>';
          $("failure-message").textContent = failure?.log ? "" : m.error || "";
        } else {
          err.style.display = "none";
        }

        $("health").innerHTML = d.serving
          ? '<span class="dot dot-ok"></span>available'
          : '<span class="dot dot-idle"></span>not published';
        $("serving").textContent = d.serving
          ? d.signed
            ? `signed${m.revision ? ` · revision ${short(m.revision)}` : ""}${m.status === "failed" ? " · last successful" : ""}`
            : `unsigned${m.revision ? ` · revision ${short(m.revision)}` : ""}${m.status === "failed" ? " · last successful" : ""}`
          : "no lock published yet";

        $("schedule-label").textContent = running ? "current run" : "next run";
        $("next-run-at").textContent =
          !running && d.next_run_at ? "at " + epoch(d.next_run_at) : "";
        tick();
        const interval = d.interval_secs;
        const rows = [
          {
            k: "repo",
            v: d.repo_url
              ? `<a href="${esc(repoHref(d.repo_url))}" target="_blank" rel="noopener noreferrer">${esc(d.repo_url)}</a>`
              : "\u2014",
          },
          { k: "branch", v: esc(d.branch || "\u2014") },
          { k: "cachix", v: esc(d.cachix_cache || "\u2014") },
          {
            k: "interval",
            v: interval ? `${Math.round(interval / 60)} min` : "\u2014",
          },
        ];
        $("source").innerHTML = rows
          .map(
            ({ k, v }) =>
              `<tr><td class="label" style="border:0">${esc(k)}</td><td class="value cyan" style="border:0">${v}</td></tr>`,
          )
          .join("");
        $("source-link").href = d.source_url || "#";
        $("build-version").hidden = !d.version;
        $("release-link").textContent = d.version ? `v${d.version}` : "";
        if (d.source_url && d.version) {
          $("release-link").href = `${d.source_url.replace(/\/$/, "")}/releases/tag/${encodeURIComponent(`v${d.version}`)}`;
        } else {
          $("release-link").removeAttribute("href");
        }

        const sys = Array.from(
          new Set([
            ...(m.systems || []),
            ...(failure
              ? [
                  ...(failure.systems || []),
                  failure.host,
                  ...(failure.completed || []).map((h) => h.name),
                ]
              : []),
          ]),
        );
        const outs = m.toplevels || [];
        const hostStats = {};
        (m.hosts || []).forEach((h) => (hostStats[h.name] = h));
        const dur = (s) => {
          if (s == null) return "";
          s = Number(s);
          return s >= 60 ? `${Math.floor(s / 60)}m${s % 60}s` : `${s}s`;
        };
        const outName = (o) =>
          o ? (o.split("/").pop() || "").replace(/^\w+-/, "") : "";
        const attempt = (s) => {
          if (m.status === "up-to-date")
            return '<span class="muted">No build needed</span>';
          if (m.status === "failed") {
            if (!failure) return '<span class="muted">Unknown</span>';
            if (failure.host === s)
              return '<span class="failure-title">✕ Failed</span>';
            if ((failure.completed || []).some((h) => h.name === s))
              return "✓ Completed";
            return '<span class="muted">Not attempted</span>';
          }
          if (m.status === "ok" && hostStats[s]) return "✓ Completed";
          return '<span class="muted">Unknown</span>';
        };
        const buildCells = (h) => {
          if (!h) return '<td class="muted">&mdash;</td><td class="muted">&mdash;</td>';
          const action = esc(h.action);
          const icon = h.action === "cached"
            ? '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h12v8H2zM3 5l1-2h8l1 2M8 7v4m-2-2 2 2 2-2"/></svg>'
            : "";
          const duration = h.action === "cached" && !h.secs ? "" : dur(h.secs);
          const logLabel = m.status === "failed" && !failure ? "Host log (outcome unknown)" : "Published build log";
          const detail = h.log
            ? `<a href="/logs/${encodeURIComponent(h.log)}" aria-label="${logLabel}${duration ? `, ${duration}` : ""}" title="${logLabel}">${duration || "view log"} ↗</a>`
            : duration || '<span class="muted">&mdash;</span>';
          return `<td><span class="tag tag-${action}">${icon}${action}</span></td><td>${detail}</td>`;
        };
        $("systems").innerHTML = sys.length
          ? sys
              .map(
                (s, i) =>
                  `<tr><td class="value blue">${esc(s)}</td><td class="attempt-cell">${attempt(s)}</td><td style="color: var(--grey)">${
                    esc(outName(outs[i])) || "\u2014"
                  }</td>${buildCells(hostStats[s])}</tr>`,
              )
              .join("")
          : '<tr><td colspan="5" style="color: var(--grey)">No published host details</td></tr>';
      }

      function tick() {
        if (uptimeSample && $("uptime")) {
          $("uptime").textContent = hms(
            uptimeSample.seconds +
              Math.floor((performance.now() - uptimeSample.at) / 1000),
          );
        }
        const countdown = $("countdown");
        if (running) {
          countdown.textContent = "in progress…";
          countdown.style.color = "var(--fg)";
        } else if (nextRunAt) {
          const remain = nextRunAt - Date.now() / 1000;
          countdown.textContent = remain > 0 ? hms(remain) : "starting…";
          countdown.style.color = remain > 0 ? "var(--blue)" : "var(--grey)";
        } else {
          countdown.textContent = "—";
          countdown.style.color = "var(--grey)";
        }
      }

      async function refresh() {
        try {
          const r = await fetch("/ui.json", { cache: "no-store" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          render(await r.json());
          lastRefresh = new Date();
          $("refresh-state").className = "";
          $("refresh-state").textContent =
            `updated ${lastRefresh.toLocaleTimeString()}`;
        } catch {
          uptimeSample = null;
          $("uptime").textContent = "—";
          $("refresh-state").className = "stale";
          $("refresh-state").textContent = lastRefresh
            ? `Connection lost · last updated ${lastRefresh.toLocaleTimeString()}`
            : "Unable to load dashboard data";
        }
      }

      refresh();
      setInterval(refresh, 15000);
      setInterval(tick, 1000);
    </script>
  </body>
</html>
