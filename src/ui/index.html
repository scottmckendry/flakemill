<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flakemill</title>
    <style>
      :root {
        --bg: #16181a;
        --bg-alt: #1e2124;
        --bg-hl: #3c4048;
        --fg: #ffffff;
        --grey: #7b8496;
        --blue: #5ea1ff;
        --green: #5eff6c;
        --cyan: #5ef1ff;
        --red: #ff6e5e;
        --yellow: #f1ff5e;
        --magenta: #ff5ef1;
        --orange: #ffbd5e;
        --border: #3c4048;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --bg-alt: #eaeaea;
          --bg-hl: #acacac;
          --fg: #16181a;
          --blue: #0057d1;
          --green: #008b0c;
          --cyan: #008c99;
          --red: #d11500;
          --yellow: #997b00;
          --magenta: #d100bf;
          --orange: #d17c00;
          --border: #acacac;
        }
      }
      * {
        box-sizing: border-box;
        border: 0;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        line-height: 1.6;
        max-width: 64rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      a {
        color: var(--cyan);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      a:hover {
        color: var(--blue);
      }
      h1 {
        color: var(--orange);
        font-size: 1.5rem;
      }
      h1::before {
        content: "# ";
        color: var(--grey);
      }
      h2 {
        color: var(--cyan);
        font-size: 1.1rem;
        margin: 2rem 0 0.75rem;
      }
      h2::before {
        content: "## ";
        color: var(--grey);
      }
      .sub {
        color: var(--grey);
        margin: 0.25rem 0 2rem;
      }
      .card {
        background: var(--bg-alt);
        border: 1px solid var(--border);
        padding: 1rem 1.25rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: 1rem;
      }
      .label {
        color: var(--grey);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .value {
        color: var(--fg);
        font-size: 1.05rem;
        overflow-wrap: anywhere;
      }
      .value.blue {
        color: var(--blue);
      }
      .value.cyan {
        color: var(--cyan);
      }
      .value.orange {
        color: var(--orange);
      }
      .status-card {
        display: grid;
        grid-template-rows: auto 1.8rem auto;
        align-items: center;
        gap: 0.25rem;
      }
      .status-card .value { font-size: 1.1rem; }
      .countdown { font-variant-numeric: tabular-nums; }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 0.4rem 0.5rem;
        text-align: left;
        font-size: 0.9rem;
      }
      th {
        color: var(--grey);
        font-weight: normal;
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .status {
        display: inline-block;
        padding: 0.05rem 0.5rem;
        font-weight: bold;
      }
      .status-ok,
      .status-up-to-date {
        color: var(--green);
      }
      .status-failed {
        color: var(--red);
      }
      .status-running {
        color: var(--yellow);
      }
      .status-idle,
      .status-unknown {
        color: var(--grey);
      }
      .status-ok::before {
        content: "[ ok ]";
      }
      .status-up-to-date::before {
        content: "[ up-to-date ]";
      }
      .status-failed::before {
        content: "[ failed ]";
      }
      .status-running::before {
        content: "[ running ]";
      }
      .status-idle::before {
        content: "[ idle ]";
      }
      .status-unknown::before {
        content: "[ … ]";
      }
      .dot {
        display: inline-block;
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        margin-right: 0.4em;
        vertical-align: baseline;
      }
      .dot-ok {
        background: var(--green);
      }
      .dot-failed {
        background: var(--red);
      }
      .dot-idle {
        background: var(--grey);
      }
      .log-link {
        color: var(--cyan);
        font-size: 0.72rem;
        margin-left: 0.5em;
      }
      .tag {
        display: inline-block;
        font-size: 0.72rem;
        padding: 0 0.4rem;
        margin-right: 0.4em;
        font-weight: bold;
      }
      .tag-built {
        color: var(--bg);
        background: var(--orange);
      }
      .tag-cached {
        color: var(--bg);
        background: var(--green);
      }
      .muted { color: var(--grey); }
      .failure-title { color: var(--red); font-weight: bold; }
      .failure-log { display: inline-block; margin: 0.25rem 0; }
      #error-box { margin-top: 0.5rem; }
      .table-wrap { overflow-x: auto; }
      .attempt-cell { white-space: nowrap; }
      #live-log-link { color: var(--blue); text-decoration: none; text-transform: none; }
      #live-log-link:hover { color: var(--cyan); }
      #refresh-state { color: var(--grey); }
      #refresh-state.stale { color: var(--red); }
      footer {
        color: var(--grey);
        margin-top: 3rem;
        font-size: 0.8rem;
      }
      footer a {
        color: var(--grey);
      }
      footer a:hover {
        color: var(--blue);
      }
      footer::before {
        content: "~ ";
        color: var(--grey);
      }
    </style>
  </head>
  <body>
    <h1>flakemill</h1>
    <p class="sub">
      external update service for nix flakes &mdash;
      <a href="/manifest.json">manifest.json</a> &middot;
      <a href="/flake.lock">flake.lock</a> &middot;
      <a href="/healthz">healthz</a>
    </p>

    <h2>status</h2>
    <div class="card" style="margin-bottom: 1rem">
      <span class="label">last run</span><br />
      <span id="status" class="status status-unknown"></span>
      <span
        id="last-run-detail"
        class="value"
        style="color: var(--grey)"
      ></span>
      <div id="error-box" style="display: none">
        <span id="failure-title"></span>
        <span id="failure-link"></span>
        <div id="failure-message" class="muted"></div>
      </div>
    </div>

    <div class="grid" style="margin-top: 1rem">
      <div class="card status-card">
        <span id="schedule-label" class="label">next run</span>
        <span id="countdown" class="value countdown blue">&mdash;</span>
        <span><span id="next-run-at" class="label"></span><a id="live-log-link" class="label" target="_blank" rel="noopener noreferrer" hidden>view logs ↗</a></span>
      </div>
      <div class="card status-card">
        <span class="label">published lock</span>
        <span id="health" class="value"><span class="dot dot-idle"></span>unknown</span>
        <span id="serving" class="label"></span>
      </div>
    </div>

    <h2>fleet</h2>
    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>host</th>
            <th>latest attempt</th>
            <th title="Output from the last successful publication">published output</th>
            <th title="Build details from the last successful publication">published build</th>
          </tr>
        </thead>
        <tbody id="systems">
          <tr>
            <td colspan="4" style="color: var(--grey)">loading…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <h2>source</h2>
    <div class="card" style="margin-bottom: 1rem">
      <table>
        <tbody id="source"></tbody>
      </table>
    </div>

    <footer>
      read-only dashboard &middot; <span id="refresh-state">connecting…</span> &middot;
      <a id="source-link" target="_blank" rel="noopener noreferrer">github</a>
      <span id="build-version"></span>
    </footer>

    <script>
      const $ = (id) => document.getElementById(id);
      const epoch = (s) =>
        s ? new Date(Number(s) * 1000).toLocaleString() : "\u2014";
      const short = (s) => (s ? s.slice(0, 10) : "\u2014");
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const repoHref = (u) => {
        if (!u) return "";
        const scpLike = /^git@([^:]+):(.+)$/.exec(u);
        const sshUrl = /^ssh:\/\/git@([^/]+)\/(.+)$/.exec(u);
        const m = scpLike || sshUrl;
        const href = m ? `https://${m[1]}/${m[2]}` : u;
        return href.replace(/\.git\/?$/, "");
      };
      const ago = (s) => {
        if (!s) return "";
        const d = Date.now() / 1000 - Number(s);
        if (d < 0) return "";
        const h = Math.floor(d / 3600),
          m = Math.floor((d % 3600) / 60);
        if (h > 0) return ` · ${h}h${m}m ago`;
        if (m > 0) return ` · ${m}m ago`;
        return ` · just now`;
      };
      const hms = (s) => {
        if (s <= 0) return "00:00:00";
        const h = Math.floor(s / 3600),
          m = Math.floor((s % 3600) / 60),
          sec = Math.floor(s % 60);
        const p = (n) => String(n).padStart(2, "0");
        return `${p(h)}:${p(m)}:${p(sec)}`;
      };

      let nextRunAt = null;
      let running = false;
      let lastRefresh = null;
      let uptimeSample = null;
      const logLink = (name, label) => `<a class="failure-log" href="/logs/${encodeURIComponent(name)}">${esc(label)}</a>`;

      function render(d) {
        nextRunAt = d.next_run_at ? Number(d.next_run_at) : null;
        running = !!d.running;
        uptimeSample = d.uptime_secs == null ? null : { seconds: Number(d.uptime_secs), at: performance.now() };
        const activeBuild = running ? d.active_build : null;
        $("live-log-link").hidden = !activeBuild;
        if (activeBuild) {
          const params = new URLSearchParams({ log: activeBuild.log, host: activeBuild.host });
          $("live-log-link").href = `/live-log?${params}`;
        }

        const m = d.manifest || {};
        const known = ["ok", "failed", "up-to-date", "unknown"];
        const status = known.includes(m.status) ? m.status : "unknown";
        $("status").className = `status status-${status}`;
        $("last-run-detail").textContent =
          (m.updated_at ? ` · ${epoch(m.updated_at)}` : "") + ago(m.updated_at);

        const err = $("error-box");
        const failure = m.status === "failed" ? m.failure : null;
        if (m.status === "failed") {
          err.style.display = "block";
          $("failure-title").textContent = failure ? `${failure.stage} · ${failure.host}` : "Affected host unknown";
          $("failure-link").innerHTML = failure?.log ? ` · ${logLink(failure.log, "View failure log →")}` : ' · <span class="muted">No failure log available</span>';
          $("failure-message").textContent = failure?.log ? "" : (m.error || "");
        } else { err.style.display = "none"; }

        $("health").innerHTML = d.serving
          ? '<span class="dot dot-ok"></span>available'
          : '<span class="dot dot-idle"></span>not published';
        $("serving").textContent = d.serving
          ? d.signed
            ? `signed${m.revision ? ` · revision ${short(m.revision)}` : ""}${m.status === "failed" ? " · last successful" : ""}`
            : `unsigned${m.revision ? ` · revision ${short(m.revision)}` : ""}${m.status === "failed" ? " · last successful" : ""}`
          : "no lock published yet";

        $("schedule-label").textContent = running ? "current run" : "next run";
        $("next-run-at").textContent = !running && d.next_run_at
          ? "at " + epoch(d.next_run_at)
          : "";
        tick();
        const interval = d.interval_secs;
        const rows = [
          {
            k: "repo",
            v: d.repo_url
              ? `<a href="${esc(repoHref(d.repo_url))}" target="_blank" rel="noopener noreferrer">${esc(d.repo_url)}</a>`
              : "\u2014",
          },
          { k: "branch", v: esc(d.branch || "\u2014") },
          { k: "cachix", v: esc(d.cachix_cache || "\u2014") },
          {
            k: "interval",
            v: interval ? `${Math.round(interval / 60)} min` : "\u2014",
          },
          {
            k: "uptime",
            v: `<span id="uptime">${uptimeSample ? hms(uptimeSample.seconds) : "\u2014"}</span>`,
          },
        ];
        $("source").innerHTML = rows
          .map(
            ({ k, v }) =>
              `<tr><td class="label" style="border:0">${esc(k)}</td><td class="value cyan" style="border:0">${v}</td></tr>`,
          )
          .join("");
        $("source-link").href = d.source_url || "#";
        $("build-version").textContent = d.version ? ` · v${d.version}` : "";

        const sys = Array.from(new Set([...(m.systems || []), ...(failure ? [...(failure.systems || []), failure.host, ...(failure.completed || []).map(h => h.name)] : [])]));
        const outs = m.toplevels || [];
        const hostStats = {};
        (m.hosts || []).forEach((h) => (hostStats[h.name] = h));
        const dur = (s) => {
          if (s == null) return "";
          s = Number(s);
          return s >= 60 ? `${Math.floor(s / 60)}m${s % 60}s` : `${s}s`;
        };
        const outName = (o) =>
          o ? (o.split("/").pop() || "").replace(/^\w+-/, "") : "";
        const attempt = (s) => {
          if (m.status === "up-to-date") return '<span class="muted">No build needed</span>';
          if (m.status === "failed") {
            if (!failure) return '<span class="muted">Unknown</span>';
            if (failure.host === s) return '<span class="failure-title">✕ Failed</span>';
            if ((failure.completed || []).some(h => h.name === s)) return '✓ Completed';
            return '<span class="muted">Not attempted</span>';
          }
          if (m.status === "ok" && hostStats[s]) return '✓ Completed';
          return '<span class="muted">Unknown</span>';
        };
        const cell = (h) => {
          if (!h) return '<span style="color: var(--grey)">&mdash;</span>';
          const action = esc(h.action);
          const log = h.log
            ? ` <a class="log-link" href="/logs/${encodeURIComponent(h.log)}">${m.status === "failed" && !failure ? "host log (outcome unknown)" : "published build log"}</a>`
            : "";
          return `<span class="tag tag-${action}">${action}</span>${
            h.action === "cached" && !h.secs ? "" : dur(h.secs)
          }${log}`;
        };
        $("systems").innerHTML = sys.length
          ? sys
              .map(
                (s, i) =>
                  `<tr><td class="value blue">${esc(s)}</td><td class="attempt-cell">${attempt(s)}</td><td style="color: var(--grey)">${
                    esc(outName(outs[i])) || "\u2014"
                  }</td><td>${cell(hostStats[s])}</td></tr>`,
              )
              .join("")
          : '<tr><td colspan="4" style="color: var(--grey)">No published host details</td></tr>';
      }

      function tick() {
        if (uptimeSample && $("uptime")) {
          $("uptime").textContent = hms(uptimeSample.seconds + Math.floor((performance.now() - uptimeSample.at) / 1000));
        }
        const countdown = $("countdown");
        if (running) {
          countdown.textContent = "in progress…";
          countdown.style.color = "var(--yellow)";
        } else if (nextRunAt) {
          const remain = nextRunAt - Date.now() / 1000;
          countdown.textContent = remain > 0 ? hms(remain) : "starting…";
          countdown.style.color = remain > 0 ? "var(--blue)" : "var(--grey)";
        } else {
          countdown.textContent = "—";
          countdown.style.color = "var(--grey)";
        }
      }

      async function refresh() {
        try {
          const r = await fetch("/ui.json", { cache: "no-store" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          render(await r.json());
          lastRefresh = new Date();
          $("refresh-state").className = "";
          $("refresh-state").textContent = `updated ${lastRefresh.toLocaleTimeString()} · refreshes every 15s`;
        } catch {
          uptimeSample = null;
          $("refresh-state").className = "stale";
          $("refresh-state").textContent = lastRefresh ? `Connection lost · last updated ${lastRefresh.toLocaleTimeString()}` : "Unable to load dashboard data";
        }
      }

      refresh();
      setInterval(refresh, 15000);
      setInterval(tick, 1000);
    </script>
  </body>
</html>
